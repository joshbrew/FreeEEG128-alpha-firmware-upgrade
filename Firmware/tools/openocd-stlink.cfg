# Adapted from Custom_SAMD21_Arduino_Bootloader's working direct ST-Link DAP setup.
# FreeEEG128: PA13=SWDIO, PA14=SWCLK, NRST=RESET. Common GND and 3.3V VTref.
adapter driver st-link
st-link vid_pid 0x0483 0x3744 0x0483 0x3748 0x0483 0x374b 0x0483 0x374d 0x0483 0x374e 0x0483 0x374f 0x0483 0x3752 0x0483 0x3753 0x0483 0x3754 0x0483 0x3755 0x0483 0x3757
if {[catch {transport select swd}]} { transport select dapdirect_swd }
source [find target/stm32h7x.cfg]
adapter speed 1000
if {[info exists FREEEEG128_CONNECT_NORMAL] && $FREEEEG128_CONNECT_NORMAL} {
    reset_config none
    cortex_m reset_config sysresetreq
} else {
    reset_config srst_only srst_nogate connect_assert_srst
}
if {[info exists FREEEEG128_CHECK_ONLY] && $FREEEEG128_CHECK_ONLY} {
    echo "FreeEEG128 H743 ST-Link configuration parsed; no hardware accessed."
    shutdown
}
